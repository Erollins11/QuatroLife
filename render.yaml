services:
  - type: web
    name: quatrolife
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /tr
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: BOOKING_URL
        sync: false
